# APIX 网关 JVM 优化参数配置
# 这些参数适用于高并发场景，可根据实际环境调整

# 基本参数
-server                                # 服务器模式
-Xms4g                                 # 初始堆大小
-Xmx4g                                 # 最大堆大小
-XX:MetaspaceSize=256m                 # 初始元空间大小
-XX:MaxMetaspaceSize=512m              # 最大元空间大小
-XX:+AlwaysPreTouch                    # 预分配内存，减少运行时分配开销

# G1 垃圾收集器配置
-XX:+UseG1GC                           # 使用G1垃圾收集器
-XX:MaxGCPauseMillis=50                # 最大GC暂停时间目标（毫秒）
-XX:G1HeapRegionSize=4m                # G1区域大小
-XX:InitiatingHeapOccupancyPercent=70  # 启动并发GC周期的堆占用率阈值
-XX:G1ReservePercent=10                # 保留内存百分比，防止晋升失败
-XX:G1NewSizePercent=30                # 新生代最小百分比
-XX:G1MaxNewSizePercent=60             # 新生代最大百分比
-XX:ParallelGCThreads=8                # 并行GC线程数
-XX:ConcGCThreads=2                    # 并发GC线程数

# 垃圾收集日志
-Xlog:gc*=info:file=logs/gc.log:time,uptime,level,tags:filecount=5,filesize=50m

# 内存优化
-XX:+UseStringDeduplication            # 字符串去重
-XX:+UseLargePages                     # 使用大页内存
-XX:LargePageSizeInBytes=2m            # 大页内存大小

# 线程优化
-XX:+UseBiasedLocking                  # 使用偏向锁
-XX:BiasedLockingStartupDelay=0        # 启动时立即启用偏向锁
-XX:+UseThreadPriorities               # 使用线程优先级
-XX:ThreadPriorityPolicy=42            # 线程优先级策略

# 网络优化
-Djava.net.preferIPv4Stack=true        # 优先使用IPv4
-Dsun.net.inetaddr.ttl=60              # DNS缓存TTL（秒）
-Djdk.nio.maxCachedBufferSize=262144   # 最大缓存缓冲区大小

# Vert.x 特定优化
-Dvertx.disableMetrics=false           # 启用Vert.x指标
-Dvertx.disableH2c=false               # 启用HTTP/2 cleartext
-Dvertx.disableWebsockets=false        # 启用WebSockets
-Dvertx.eventLoopPoolSize=16           # 事件循环池大小
-Dvertx.workerPoolSize=32              # 工作线程池大小
-Dvertx.maxWorkerExecuteTime=60000000000  # 最大工作线程执行时间（纳秒）
-Dvertx.maxEventLoopExecuteTime=2000000000  # 最大事件循环执行时间（纳秒）

# 调试和监控（生产环境可以禁用）
-Dcom.sun.management.jmxremote=true    # 启用JMX
-Dcom.sun.management.jmxremote.port=9999  # JMX端口
-Dcom.sun.management.jmxremote.authenticate=false  # 禁用JMX认证
-Dcom.sun.management.jmxremote.ssl=false  # 禁用JMX SSL
-XX:+HeapDumpOnOutOfMemoryError        # OOM时生成堆转储
-XX:HeapDumpPath=logs/heapdump.hprof   # 堆转储路径

# 其他优化
-XX:+OptimizeStringConcat              # 优化字符串连接
-XX:+UseCompressedOops                 # 使用压缩指针
-XX:+UseCompressedClassPointers        # 使用压缩类指针
-XX:+DisableExplicitGC                 # 禁用显式GC调用
