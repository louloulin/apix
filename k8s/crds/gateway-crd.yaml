apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: gateways.apix.louloulin.com
spec:
  group: apix.louloulin.com
  names:
    kind: Gateway
    listKind: GatewayList
    plural: gateways
    singular: gateway
    shortNames:
      - gw
  scope: Namespaced
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required:
                - mode
              properties:
                mode:
                  type: string
                  enum:
                    - control
                    - data
                    - hybrid
                  description: "Gateway mode: control, data, or hybrid"
                replicas:
                  type: integer
                  minimum: 1
                  default: 1
                  description: "Number of replicas for the gateway"
                image:
                  type: string
                  description: "Gateway container image"
                config:
                  type: object
                  properties:
                    logLevel:
                      type: string
                      enum:
                        - debug
                        - info
                        - warn
                        - error
                      default: info
                    adminPort:
                      type: integer
                      minimum: 1
                      maximum: 65535
                      default: 8001
                    proxyPort:
                      type: integer
                      minimum: 1
                      maximum: 65535
                      default: 8000
                    dbless:
                      type: boolean
                      default: false
                    eventBus:
                      type: object
                      properties:
                        clusterName:
                          type: string
                        clusterType:
                          type: string
                          enum:
                            - hazelcast
                            - infinispan
                            - none
                          default: hazelcast
                  additionalProperties: true
                resources:
                  type: object
                  properties:
                    limits:
                      type: object
                      properties:
                        cpu:
                          type: string
                          pattern: '^(\d+m|\d+(\.\d+)?|\d+(\.\d+)?[m])$'
                        memory:
                          type: string
                          pattern: '^(\d+(e\d+)?|\d+(\.\d+)?(e\d+)?)(E|P|T|G|M|K|Ei|Pi|Ti|Gi|Mi|Ki)?$'
                    requests:
                      type: object
                      properties:
                        cpu:
                          type: string
                          pattern: '^(\d+m|\d+(\.\d+)?|\d+(\.\d+)?[m])$'
                        memory:
                          type: string
                          pattern: '^(\d+(e\d+)?|\d+(\.\d+)?(e\d+)?)(E|P|T|G|M|K|Ei|Pi|Ti|Gi|Mi|Ki)?$'
            status:
              type: object
              properties:
                phase:
                  type: string
                  enum:
                    - Pending
                    - Running
                    - Failed
                  description: "Current phase of the gateway"
                message:
                  type: string
                  description: "Human-readable message indicating details about the current status"
                replicas:
                  type: integer
                  description: "Current number of replicas"
                readyReplicas:
                  type: integer
                  description: "Number of ready replicas"
                conditions:
                  type: array
                  items:
                    type: object
                    required:
                      - type
                      - status
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                        enum:
                          - "True"
                          - "False"
                          - "Unknown"
                      reason:
                        type: string
                      message:
                        type: string
                      lastTransitionTime:
                        type: string
                        format: date-time
      additionalPrinterColumns:
        - name: Mode
          type: string
          jsonPath: .spec.mode
        - name: Replicas
          type: integer
          jsonPath: .spec.replicas
        - name: Status
          type: string
          jsonPath: .status.phase
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      subresources:
        status: {}
