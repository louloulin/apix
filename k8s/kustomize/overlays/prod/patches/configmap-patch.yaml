apiVersion: v1
kind: ConfigMap
metadata:
  name: apix-config
data:
  config.yaml: |
    mode: hybrid
    log_level: info
    dbless: true
    
    admin:
      listen: 0.0.0.0:8001
    
    proxy:
      listen: 0.0.0.0:8000
    
    eventbus:
      cluster_name: apix-cluster
      cluster_type: hazelcast
    
    plugins:
      enabled:
        - name: rate-limiting
          config:
            limit: 100
            period: second
        - name: cors
          config:
            origins:
              - "https://api.example.com"
            methods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            headers:
              - Content-Type
              - Authorization
            credentials: true
            maxAge: 3600
        - name: prometheus
          config:
            scrape_interval: 15s
        - name: circuit-breaker
          config:
            threshold: 50
            window_size: 100
            min_request_count: 20
            timeout: 5000
