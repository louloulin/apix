---
# Admin Service
apiVersion: v1
kind: Service
metadata:
  name: apix-admin
spec:
  type: ClusterIP
  ports:
    - port: 8001
      targetPort: admin
      protocol: TCP
      name: http
  selector:
    app: apix

---
# Proxy Service
apiVersion: v1
kind: Service
metadata:
  name: apix-proxy
spec:
  type: ClusterIP
  ports:
    - port: 8000
      targetPort: proxy
      protocol: TCP
      name: http
  selector:
    app: apix
