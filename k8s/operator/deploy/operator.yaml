apiVersion: apps/v1
kind: Deployment
metadata:
  name: apix-operator
  namespace: apix-system
spec:
  replicas: 1
  selector:
    matchLabels:
      name: apix-operator
  template:
    metadata:
      labels:
        name: apix-operator
    spec:
      serviceAccountName: apix-operator
      containers:
        - name: apix-operator
          image: louloulin/apix-operator:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: WATCH_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: OPERATOR_NAME
              value: "apix-operator"
          resources:
            limits:
              cpu: 500m
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 128Mi
