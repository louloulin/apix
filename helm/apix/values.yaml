# Default values for APIX AI Gateway
# This is a YAML-formatted file.

# Deployment configuration
deployment:
  # Deployment mode: control, data, or hybrid
  mode: hybrid
  
  # Number of replicas
  replicas: 1
  
  # Image configuration
  image:
    repository: louloulin/apix
    tag: latest
    pullPolicy: IfNotPresent
  
  # Resource limits and requests
  resources:
    limits:
      cpu: 2000m
      memory: 2Gi
    requests:
      cpu: 500m
      memory: 512Mi
  
  # Node selector
  nodeSelector: {}
  
  # Tolerations
  tolerations: []
  
  # Affinity
  affinity: {}

# Service configuration
service:
  # Admin service
  admin:
    type: ClusterIP
    port: 8001
    annotations: {}
  
  # Proxy service
  proxy:
    type: ClusterIP
    port: 8000
    annotations: {}

# Ingress configuration
ingress:
  # Admin ingress
  admin:
    enabled: false
    className: ""
    annotations: {}
    hosts:
      - host: admin.apix.local
        paths:
          - path: /
            pathType: Prefix
    tls: []
  
  # Proxy ingress
  proxy:
    enabled: false
    className: ""
    annotations: {}
    hosts:
      - host: api.apix.local
        paths:
          - path: /
            pathType: Prefix
    tls: []

# APIX configuration
apix:
  # Log level: debug, info, warn, error
  logLevel: info
  
  # DB-less mode
  dbless: true
  
  # EventBus configuration
  eventBus:
    clusterName: apix-cluster
    clusterType: hazelcast
  
  # Plugins configuration
  plugins:
    enabled:
      - name: rate-limiting
        config:
          limit: 100
          period: minute
      - name: cors
        config:
          origins:
            - "*"
          methods:
            - GET
            - POST
            - PUT
            - DELETE
            - OPTIONS
          headers:
            - Content-Type
            - Authorization
          credentials: true
          maxAge: 3600
  
  # Custom configuration
  customConfig: {}

# Persistence configuration
persistence:
  enabled: false
  storageClass: ""
  accessMode: ReadWriteOnce
  size: 1Gi

# Metrics configuration
metrics:
  enabled: true
  serviceMonitor:
    enabled: false
    additionalLabels: {}

# Tracing configuration
tracing:
  enabled: false
  provider: jaeger
  jaeger:
    endpoint: http://jaeger-collector:14268/api/traces

# Logging configuration
logging:
  enabled: true
  provider: stdout
  elasticsearch:
    enabled: false
    host: elasticsearch-master
    port: 9200
    index: apix-logs
