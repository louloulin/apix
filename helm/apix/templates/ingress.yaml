{{- if .Values.ingress.admin.enabled -}}
---
# Admin Ingress
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "apix.fullname" . }}-admin
  labels:
    {{- include "apix.labels" . | nindent 4 }}
    app.kubernetes.io/component: admin
  {{- with .Values.ingress.admin.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.ingress.admin.className }}
  ingressClassName: {{ .Values.ingress.admin.className }}
  {{- end }}
  {{- if .Values.ingress.admin.tls }}
  tls:
    {{- range .Values.ingress.admin.tls }}
    - hosts:
        {{- range .hosts }}
        - {{ . | quote }}
        {{- end }}
      secretName: {{ .secretName }}
    {{- end }}
  {{- end }}
  rules:
    {{- range .Values.ingress.admin.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            pathType: {{ .pathType }}
            backend:
              service:
                name: {{ include "apix.fullname" $ }}-admin
                port:
                  name: http
          {{- end }}
    {{- end }}
{{- end }}

